services:
  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf
      - ./web:/var/www/web.twohoursonelife.com/web
      - ./data/diffDownloads:/var/www/web.twohoursonelife.com/web/public/downloads
      - ./data:/var/www/web.twohoursonelife.com/data
    ports:
      - 80:80
    depends_on:
      - php
      - mysql

  php:
    build:
      target: base
    restart: always
    env_file:
      - .env.dev
    volumes:
      - ./web:/var/www/web.twohoursonelife.com/web
      - ./data/diffDownloads:/var/www/web.twohoursonelife.com/web/public/downloads
      - ./data:/var/www/web.twohoursonelife.com/data
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    restart: always
    env_file:
      - .env.dev
    ports:
      - 3306:3306
    volumes:
      - mysqldata-dev:/var/lib/mysql

volumes:
  mysqldata-dev: {}
